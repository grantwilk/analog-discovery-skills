name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Validate skills
        run: python tools/validate_skills.py

      - name: Unit tests
        run: python -m pytest
